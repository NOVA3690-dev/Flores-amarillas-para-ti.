<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Ti 🌻✨</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stars"></div>
  <div class="twinkling"></div>

  <div class="container">
    <div class="center-heart">
      <div class="heart">💛</div>
      <h2>Te amo ✨</h2>
      
      <!-- Reproductor de audio con Treat You Better -->
      <div class="music-player" style="margin-top: 15px;">
        <audio id="bg-music" loop preload="auto">
          <source src="https://files.catbox.moe/w22o9g.mp3" type="audio/mpeg">
        </audio>
        <button onclick="document.getElementById('bg-music').play(); this.style.display='none';" style="background: #ffd700; border: none; padding: 10px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; color: #000; box-shadow: 0 0 10px #ffd700;">
          ▶ Toca para escuchar la música 🎶
        </button>
      </div>
    </div>

    <!-- Flores flotantes -->
    <div class="flower f1">🌻 <span>Eres mi sol</span></div>
    <div class="flower f2">💐 <span>Te quiero mucho</span></div>
    <div class="flower f3">🌻 <span>Mi Amor 💛</span></div>
    <div class="flower f4">💐 <span>Me encantas</span></div>
    <div class="flower f5">🌻 <span>Siempre juntos</span></div>
  </div>
</body>
</html>
