<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Ti 🌻✨</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Fondo de partículas doradas -->
  <div class="gold-galaxy" id="galaxy"></div>

  <div class="main-content">
    <!-- Corazón de destellos dorados en el centro -->
    <div class="sparkle-heart-wrapper">
      <div class="sparkle-heart"></div>
      <div class="center-text">
        <h2>Te amo 💛✨</h2>
      </div>
    </div>

    <!-- Ramo de girasoles realistas en el centro -->
    <div class="sunflower-bouquet">
      <img src="https://images.unsplash.com/photo-1597848212624-a19eb35e2651?q=80&w=600&auto=format&fit=crop" alt="Ramo de Girasoles" class="bouquet-img">
    </div>

    <!-- Reproductor de música -->
    <div class="player-container">
      <button id="playBtn" class="gold-btn">▶ Reproducir Música 🎶</button>
      <p class="song-title">🎵 Jorge Cuéllar - YUANFEN</p>
    </div>

    <!-- Elementos flotantes por toda la pantalla -->
    <div class="floating-item f1">🌻 <span>Eres mi sol</span></div>
    <div class="floating-item f2">💐 <span>Te adoro</span></div>
    <div class="floating-item f3">🌻 <span>Mi Amor 💛</span></div>
    <div class="floating-item f4">💐 <span>Me encantas</span></div>
    <div class="floating-item f5">✨ <span>Siempre juntos</span></div>
    <div class="floating-item f6">🌻 <span>Amor de mi vida</span></div>
    <div class="floating-item f7">💐 <span>Eres mi todo</span></div>
  </div>

  <!-- Audio de la canción YUANFEN de Jorge Cuéllar -->
  <audio id="audioTrack" loop preload="auto">
    <source src="https://ia801504.us.archive.org/12/items/jorge-cuellar-yuanfen/Jorge%20Cu%C3%A9llar%20-%20YUANFEN.mp3" type="audio/mpeg">
  </audio>

  <script>
    // Generar galaxia de polvo de estrellas dorado muy tupida
    const galaxy = document.getElementById('galaxy');
    for (let i = 0; i < 200; i++) {
      const p = document.createElement('div');
      p.className = 'gold-particle';
      p.style.top = Math.random() * 100 + 'vh';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.animationDuration = (Math.random() * 3 + 1.5) + 's';
      p.style.animationDelay = Math.random() * 3 + 's';
      p.style.width = (Math.random() * 4 + 1) + 'px';
      p.style.height = p.style.width;
      galaxy.appendChild(p);
    }

    // Control de reproducción de música
    const btn = document.getElementById('playBtn');
    const audio = document.getElementById('audioTrack');

    btn.addEventListener('click', function() {
      if (audio.paused) {
        audio.play().then(() => {
          btn.textContent = '⏸ Pausar Música';
          btn.classList.add('playing');
        }).catch(() => {
          alert('Toca de nuevo el botón para iniciar el audio.');
        });
      } else {
        audio.pause();
        btn.textContent = '▶ Reproducir Música 🎶';
        btn.classList.remove('playing');
      }
    });
  </script>
</body>
</html>
