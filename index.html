<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Ti 🌻✨</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stars"></div>
  <div class="twinkling"></div>

  <div class="container">
    <div class="center-heart">
      <div class="heart">💛</div>
      <h2>Te amo ✨</h2>
      
      <!-- Reproductor de audio funcionando -->
      <div class="music-player">
        <audio controls loop preload="auto">
          <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=romantic-guitars-112318.mp3" type="audio/mpeg">
        </audio>
      </div>
    </div>

    <!-- Flores flotantes -->
    <div class="flower f1">🌻 <span>Eres mi sol</span></div>
    <div class="flower f2">💐 <span>Te adoro</span></div>
    <div class="flower f3">🌻 <span>Mi Amor 💛</span></div>
    <div class="flower f4">💐 <span>Me encantas</span></div>
    <div class="flower f5">🌻 <span>Siempre juntos</span></div>
  </div>
</body>
</html>
