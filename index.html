<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Ti 🌻✨</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="galaxy">
    <div class="stars"></div>
    
    <div class="center-heart">
      <div class="heart">💛</div>
      <h2>Te amo ✨</h2>
      
      <!-- Reproductor de música -->
      <div style="margin-top: 15px;">
        <audio controls autoplay loop style="height: 35px; opacity: 0.8; max-width: 250px;">
          <source src="https://ia801503.us.archive.org/15/items/shawn-mendes-treat-you-better/Shawn%20Mendes%20-%20Treat%20You%20Better.mp3" type="audio/mpeg">
          Tu navegador no soporta el reproductor de audio.
        </audio>
      </div>
    </div>

    <!-- Flores flotantes y mensajes -->
    <div class="flower f1">🌻 <span>Eres mi sol</span></div>
    <div class="flower f2">💐 <span>Te adoro</span></div>
    <div class="flower f3">🌻 <span>Mi Amor 💛</span></div>
    <div class="flower f4">💐 <span>Me encantas</span></div>
    <div class="flower f5">🌻 <span>Siempre juntos</span></div>
  </div>
</body>
</html>
