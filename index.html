<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para PAULA 🌻✨</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stars-container" id="stars"></div>

  <div class="container">
    <div class="center-heart">
      <div class="heart">💛</div>
      <h2>Te amo ✨</h2>
      
      <div class="music-player">
        <button id="playBtn" class="btn-play">
          ▶ Reproducir Música 🎶
        </button>
      </div>
    </div>

    <div class="flower f1">🌻 <span>Eres mi sol</span></div>
    <div class="flower f2">💐 <span>Te quiero </span></div>
    <div class="flower f3">🌻 <span>Mi Amor 💛</span></div>
    <div class="flower f4">💐 <span>Me encantas</span></div>
    <div class="flower f5">🌻 <span>Siempre juntos</span></div>
  </div>

  <script>
    // Crear estrellas en el fondo sin imagenes externas
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 120; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.top = Math.random() * 100 + 'vh';
      star.style.left = Math.random() * 100 + 'vw';
      star.style.animationDuration = (Math.random() * 2 + 1) + 's';
      star.style.animationDelay = Math.random() * 2 + 's';
      starsContainer.appendChild(star);
    }

    // Audio sintetizado / reproductor directo
    const audio = new Audio('https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=romantic-guitars-112318.mp3');
    audio.loop = true;

    document.getElementById('playBtn').addEventListener('click', function() {
      if (audio.paused) {
        audio.play().then(() => {
          this.textContent = '⏸ Pausar Música';
          this.classList.add('playing');
        }).catch(err => {
          alert('Por favor vuelve a presionar el botón de música');
        });
      } else {
        audio.pause();
        this.textContent = '▶ Reproducir Música 🎶';
        this.classList.remove('playing');
      }
    });
  </script>
</body>
</html>
